# reRankQ Configuration
# =====================

corpus:
  name: "stripe_api_docs"
  source: "https://docs.stripe.com"
  base_url: "https://docs.stripe.com"
  # We'll crawl the docs site and extract content
  max_pages: 500  # Safety limit
  
chunking:
  # Strategy 1: Fixed-size with overlap
  fixed_size:
    chunk_size: 512  # tokens
    chunk_overlap: 50  # tokens
  
  # Strategy 2: Structure-aware (respects headers/sections)
  structure_aware:
    max_chunk_size: 512  # tokens
    min_chunk_size: 100  # tokens
    respect_headers: true

embedding:
  model_name: "all-MiniLM-L6-v2"  # Fast, good quality for docs
  batch_size: 64
  normalize: true

retrieval:
  bm25:
    k1: 1.5
    b: 0.75
  
  dense:
    top_k: 20  # Candidates before reranking
  
  hybrid:
    method: "rrf"  # reciprocal rank fusion
    k: 60  # RRF constant
    bm25_weight: 0.5
    dense_weight: 0.5
  
  reranking:
    model_name: "cross-encoder/ms-marco-MiniLM-L-6-v2"
    top_k: 5  # Final results after reranking

generation:
  provider: "anthropic"  # or "openai"
  model: "claude-3-5-sonnet-20241022"
  max_tokens: 1024
  temperature: 0.1

evaluation:
  eval_set_size: 50  # Minimum labeled pairs
  metrics:
    - "recall@k"
    - "mrr"
    - "ndcg@k"
  k_values: [1, 3, 5, 10]

api:
  host: "0.0.0.0"
  port: 8000
  log_latency: true

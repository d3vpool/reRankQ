[project]
name = "rerankq"
version = "0.1.0"
description = "A portfolio-grade hybrid search and RAG system with evaluation and ablations"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.5.0",
    "pyyaml>=6.0.0",
    "httpx>=0.25.0",
    "sentence-transformers>=2.2.2",
    "faiss-cpu>=1.7.4",
    "rank-bm25>=0.2.2",
    "tiktoken>=0.5.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=4.9.0",
    "pandas>=2.1.0",
    "numpy>=1.25.0",
    "scikit-learn>=1.3.0",
    "tqdm>=4.66.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.1.0",
    "mypy>=1.7.0",
]
evaluation = [
    "ragas>=0.1.0",
    "openai>=1.6.0",
]

[project.scripts]
rerankq = "src.api.main:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: exercises several components together, no external services",
    "real_model: downloads and runs sentence-transformers models (opt-in)",
]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
